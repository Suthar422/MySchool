spring:
  application:
    name: api-gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: userinfo-service
              uri: lb://userinfo-service
              predicates:
                - Path=/userinfo/**

            - id: book-seat-service
              uri: lb://book-seat-service
              predicates:
                - Path=/bookseat/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8889/realms/master/protocol/openid-connect/certs"

server:
  port: 8888

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
